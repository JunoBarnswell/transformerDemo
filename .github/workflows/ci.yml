name: tiny-transformer-chat-cpu-demo

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tokenizer/data/model smoke tests
        run: |
          PYTHONPATH=src python -m pytest tests/test_tokenizer.py tests/test_data.py tests/test_model.py

      - name: Run train smoke test
        run: |
          PYTHONPATH=src python -m pytest tests/test_train_smoke.py

      - name: Run infer/chat smoke tests
        run: |
          PYTHONPATH=src python -m pytest tests/test_infer_smoke.py tests/test_chat_cli.py

      - name: Run vision contract and shape tests
        run: |
          PYTHONPATH=src python -m pytest tests/test_vision_*.py
