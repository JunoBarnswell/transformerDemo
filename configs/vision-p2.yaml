seed: 42

vision:
  reference: ultralytics-v8.4.0
  architecture: yolov8n-p2
  input_size: 640
  num_classes: 6
  class_names: [crazing, inclusion, patches, pitted_surface, rolled-in_scale, scratches]
  confidence_threshold: 0.25
  nms_threshold: 0.7
  max_detections: 300

vision_init:
  mode: project_base
  checkpoint: weights/vision_base.pt

data:
  manifest: data/neu_det/train.jsonl
  validation_manifest: data/neu_det/val.jsonl

training:
  stage: baseline
  output_dir: outputs/vision-yolov8n-p2
  batch_size: 4
  gradient_accumulation: 16
  num_workers: 0
  max_epochs: 100
  min_epochs: 30
  early_stopping_patience: 20
  warmup_epochs: 3
  min_lr_factor: 0.01
  learning_rate: 0.001
  box_learning_rate: 0.0001
  weight_decay: 0.0005
  grad_clip: 1.0
  ema_decay: 0.9999
  validation_interval: 1
