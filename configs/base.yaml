seed: 42

data:
  data_file: data/sample_conversations.jsonl
  vocab_path: data/vocab.json
  vocab_size: 2000
  seq_len: 512
  max_context_turns: 4

train:
  output_dir: outputs/run_rope
  batch_size: 4
  num_workers: 0
  max_steps: 1200
  max_epochs: 100
  learning_rate: 0.0008
  grad_clip: 1.0
  eval_interval: 20
  save_interval: 50
  log_interval: 20
  early_stop_patience: 30
  train_log_file: train_log.jsonl
  loss_curve_file: loss_curve.json
  inference_log_file: inference_log.jsonl
  num_infer_prompts: 3

model:
  d_model: 128
  nhead: 4
  n_layers: 3
  ff_dim: 256
  dropout: 0.1

generation:
  max_new_tokens: 100
  temperature: 0.1
  top_k: 1
  top_p: 0.9

memory:
  recent_window: 4
  compact_threshold: 6
  summary_max_tokens: 40

thinking:
  enabled: true
  expose_thinking: true
