seed: 42

vision:
  input_size: 640
  num_classes: 6
  class_names: [crazing, inclusion, patches, pitted_surface, rolled-in_scale, scratches]
  segmentation_classes: 2
  backbone_channels: [4, 8, 16, 32, 64]
  backbone_depths: [1, 1, 1, 1, 1]
  neck_channels: [4, 8, 16, 32, 64]
  use_p5: auto
  detect_levels: [P2, P3, P4]
  detection_hidden_channels: 32
  reg_max: 16
  confidence_threshold: 0.05
  nms_threshold: 0.50
  max_detections: 100

vision_init:
  mode: random

data:
  manifest: generated_train_v5/manifest.jsonl

training:
  task: detection
  fewshot_stage: f4
  output_dir: model_balanced_50_v2
  batch_size: 16
  num_workers: 0
  max_epochs: 16
  warmup_epochs: 2
  min_lr_factor: 0.05
  learning_rate: 0.0015
  regression_learning_rate: 0.0015
  weight_decay: 0.0001
  grad_clip: 1.0
  save_interval: 4
  evaluation_confidence_threshold: 0.001
  augmentation:
    enabled: false
  device: cpu
