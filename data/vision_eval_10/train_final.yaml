seed: 42

vision:
  input_size: 640
  num_classes: 6
  class_names: [crazing, inclusion, patches, pitted_surface, rolled-in_scale, scratches]
  segmentation_classes: 2
  backbone_channels: [8, 16, 32, 64, 128]
  backbone_depths: [1, 1, 2, 2, 1]
  neck_channels: [8, 16, 32, 64, 128]
  use_p5: auto
  detect_levels: [P2, P3, P4]
  reg_max: 16
  # Holdout threshold sweep selected 0.05 as the balanced product point.
  confidence_threshold: 0.05
  nms_threshold: 0.50
  max_detections: 100

vision_init:
  mode: random

data:
  manifest: manifest_all.jsonl

training:
  task: detection
  fewshot_stage: f4
  output_dir: model_final_v2
  batch_size: 2
  num_workers: 0
  max_epochs: 80
  warmup_epochs: 3
  min_lr_factor: 0.05
  learning_rate: 0.0015
  regression_learning_rate: 0.0015
  weight_decay: 0.0001
  grad_clip: 1.0
  save_interval: 10
  evaluation_confidence_threshold: 0.001
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotate90: 0.5
    brightness: 0.05
    contrast: 0.05
  device: cpu
