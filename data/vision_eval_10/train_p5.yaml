seed: 42

vision:
  input_size: 640
  num_classes: 6
  class_names: [crazing, inclusion, patches, pitted_surface, rolled-in_scale, scratches]
  segmentation_classes: 2
  backbone_channels: [4, 8, 16, 32, 64]
  backbone_depths: [1, 1, 1, 1, 1]
  neck_channels: [4, 8, 16, 32, 64]
  use_p5: true
  detect_levels: [P2, P3, P4, P5]
  reg_max: 16
  confidence_threshold: 0.10
  nms_threshold: 0.50
  max_detections: 100

vision_init:
  mode: random

data:
  manifest: manifest_train.jsonl

training:
  task: detection
  fewshot_stage: f4
  output_dir: data/vision_eval_10/model_p5_clsfix
  batch_size: 1
  num_workers: 0
  max_steps: 240
  learning_rate: 0.001
  regression_learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  save_interval: 40
  device: cpu
